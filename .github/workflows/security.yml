name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '37 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Composer dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Restore Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-8.3-composer-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --no-audit

      - name: Audit dependencies
        run: composer audit --no-interaction --abandoned=report
